<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Class 16: Step 1: my contact page -->

    <!-- Class 18: Step 1: let Netlify handle the submission -->
 <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field"></form>
 <p class="hidden-field">
<label> Leave this empty: <input name="bot-field" type="text"></label>
 </p>


    <title>Contact - Tahje Wilson</title>
    <!-- Class 12: Step 1: a typeface I chose -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Class 15: Step 1: my third file -->
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Class 13: Step 2: navigation -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <!-- Class 16: Step 1: the contact link -->
            <li><a href="contact.html" class="current">Contact</a></li>
            <li><a href="reading.html">Reading</a></li>
            <!-- Class 15: Step 3: the theme button -->
            <li><button id="theme-toggle" type="button">Dark</button></li>
        </ul>
    </nav>

    <!-- Lab 12 Task 1: group the text so it stacks beside the photo -->
    <header>
        <!-- Class 12: Step 3: an image -->
        <img src="images/Tahje.png" alt="Portrait of Tahje Wilson" class="portrait">
        <div class="header-text">
            <h1>Contact</h1>
            <p>Questions about my experience or something else.</p>
        </div>
    </header>

    <main>
        <!-- Class 16: Step 2: a form -->
        <form id="contact-form">
            <p>
                <label for="name">Your name</label>
                <input id="name" name="name" type="text">
            </p>

            <p>
                <label for="email">Your Email</label>
                <input id="email" name="email" type="email" required>
            </p>
            <p>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                <!-- Lab 16 Task 4: Live Character count -->
                <br>
                <small id="message-count">0 characters</small>
            </p>
            <p>
                <button type="submit">Send</button>
            </p>
        </form>

        <p id="form-status" role="status"></p>
    </main>

    <!-- Lab 12 Task 3: footer -->
    <footer>
        <p>&copy; <span id="year"></span> Tahje Wilson</p>
        <a href="https://github.com/swilsontc" target="_blank" rel="noopener">GitHub</a>
    </footer>
</body>
</html>
